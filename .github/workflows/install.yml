name: Installer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/tests/test-install.sh

  bash:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # /bin/bash do macOS é a 3.2: é o que roda no "curl | bash" de quem usa Mac.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Testes do install.sh
        env:
          BASH_BIN: ${{ matrix.bash }}
        run: ${{ matrix.bash }} scripts/tests/test-install.sh

  powershell:
    strategy:
      fail-fast: false
      matrix:
        # pwsh = PowerShell 7; powershell = Windows PowerShell 5.1 (padrão do Windows).
        shell: [pwsh, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Testes do install.ps1
        shell: ${{ matrix.shell }}
        run: ./scripts/tests/test-install.ps1
