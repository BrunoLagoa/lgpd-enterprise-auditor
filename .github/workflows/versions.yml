name: Versions

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versão única entre SKILL.md, comandos, CHANGELOG e tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/tests/test-versions.sh "$TAG"
