name: Framework

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Catálogo, paridade, cenários, manifestos e documentação
        run: bash scripts/tests/test-framework.sh

  # O mesmo teste no bash 3.2 e no awk do macOS, que é onde boa parte das contribuições nasce.
  framework-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Catálogo, paridade, cenários, manifestos e documentação (bash 3.2)
        run: /bin/bash scripts/tests/test-framework.sh
